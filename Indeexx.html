<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DevOps Demo</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7f9;
            text-align: center;
        }

        header {
            background-color: #24292f;
            color: white;
            padding: 30px;
        }

        h1 {
            margin: 0;
        }

        .container {
            margin: 80px auto;
            padding: 40px;
            max-width: 600px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .success {
            color: green;
            font-size: 22px;
            font-weight: bold;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <header>
        <h1>My DevOps Application</h1>
    </header>

    <div class="container">

        <h2>Hello DevOps!</h2>

        <p class="success">
            Application deployed successfully!
        </p>

        <p>
            This application is deployed using GitHub and Jenkins.
        </p>

        <button onclick="showMessage()">
            Click Me
        </button>

        <p id="message"></p>

    </div>

    <script>
        function showMessage() {
            document.getElementById("message").innerHTML =
                "Jenkins deployment is working!";
        }
    </script>

</body>
</html>
